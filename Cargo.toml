[package]
name = "viewer3d"
version = "0.1.0"
edition = "2021"
description = "Offline 3D Model Viewer (like an image viewer, but for 3D files)"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "0.15"
glam = "0.29"
tobj = "4"
stl_io = "0.8"
ply-rs = "0.1"
gltf = { version = "1", default-features = false, features = ["import", "utils", "names"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
serde_json = "1"
fbxcel-dom = "0.0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# CAD formats (STEP, IGES, BREP, FCStd): small C++ shim around OpenCASCADE, see cad-sys/
cad-sys = { path = "cad-sys", optional = true }

[features]
# Windows:  cargo build --release --features cad
#   Builds OpenCASCADE from source (needs CMake + Visual Studio C++ tools; slow the first time).
cad = ["dep:cad-sys", "cad-sys/builtin"]
# Linux:    cargo build --release --features cad-system
#   Uses the OpenCASCADE packages installed on the system.
cad-system = ["dep:cad-sys", "cad-sys/system"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
winresource = "0.1"
