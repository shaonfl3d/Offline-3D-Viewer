# Builds the Windows installer, the portable zip and the Linux package on GitHub's servers.
#
# Make a release, either way:
#   * push a commit to main whose message contains "[release]": the release is tagged
#     v<version in Cargo.toml> (bump the version first), or
#   * create a release on GitHub with a new tag such as v3.1.0.
# Every other push to main only builds and tests (the files are kept as run artifacts).
name: Release

on:
  push:
    tags: ["v*"]
    # Also build (without making a release) when the code changes, to catch problems early.
    branches: [main]
    paths: ["src/**", "cad-sys/**", "Cargo.toml", "Cargo.lock", "build.rs", ".cargo/**", "packaging/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # A push to main whose commit message contains "[release]" also publishes a release,
  # tagged v<version from Cargo.toml>. The tag is created by the release step itself.
  RELEASE: ${{ contains(github.event.head_commit.message, '[release]') }}

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # Pinned to a tested Rust version (the test program crashed at exit with Rust 1.100).
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Reuse OpenCASCADE from an earlier run
        uses: actions/cache/restore@v4
        with:
          path: |
            target/OCCT/include
            target/OCCT/lib
          key: occt-7.8.1-windows-msvc-static-crt-v1
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --features cad
      - name: Save OpenCASCADE for later runs
        if: always() && hashFiles('target/OCCT/include/Standard_Version.hxx') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            target/OCCT/include
            target/OCCT/lib
          key: occt-7.8.1-windows-msvc-static-crt-v1
        continue-on-error: true
      - name: Crash details (debugger)
        if: failure()
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
        run: |
          cargo test --release --features cad --no-run
          $bin = Get-ChildItem target\release\deps\viewer3d-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          & $cdb -lines -c "sxe av; g; .ecxr; kn 40; ~*kn 12; q" $bin.FullName --test-threads=1
      - name: Build
        run: cargo build --release --features cad
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; elif [[ "$RELEASE" == "true" ]]; then V="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"; else V=dev; fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.v }}" packaging\windows\installer.iss
          Compress-Archive -Path target\release\viewer3d.exe -DestinationPath "installer_output\3DViewer_portable_${{ steps.ver.outputs.v }}_windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer_output/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to a tested Rust version (the test program crashed at exit with Rust 1.100).
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Reuse OpenCASCADE from an earlier run
        uses: actions/cache/restore@v4
        with:
          path: |
            target/OCCT/include
            target/OCCT/lib
          key: occt-7.8.1-ubuntu-22.04-v1
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --features cad
      - name: Save OpenCASCADE for later runs
        if: always() && hashFiles('target/OCCT/include/Standard_Version.hxx') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            target/OCCT/include
            target/OCCT/lib
          key: occt-7.8.1-ubuntu-22.04-v1
        continue-on-error: true
      - name: Crash details (debugger)
        if: failure()
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
        run: |
          sudo apt-get install -y gdb > /dev/null
          cargo test --release --features cad --no-run
          BIN=$(ls -t target/release/deps/viewer3d-* | grep -v '\.d$' | head -1)
          gdb -q -batch -ex "set pagination off" -ex run -ex "bt 40" -ex "thread apply all bt 12" --args "$BIN" --test-threads=1
      - name: Build
        run: cargo build --release --features cad
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; elif [[ "$RELEASE" == "true" ]]; then V="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"; else V=dev; fi
          packaging/linux/make-package.sh target/release/viewer3d "3DViewer_${V}_linux_x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then T="$GITHUB_REF_NAME"; else T="v$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"; fi
          echo "t=$T" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.t }}
          target_commitish: ${{ github.sha }}
          name: 3D Viewer ${{ steps.tag.outputs.t }}
          make_latest: true
          files: out/*
